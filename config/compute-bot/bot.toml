[irc]
server = "127.0.0.1"
port = 6667
nick = "DereksBotHerder"
account = "DereksBotHerder"
password_env = "IRC_BOT_PASSWORD"
owner_account = "admin"
# Any authenticated account may address this Herder by nick. A bare "!command"
# is still owner-only, so one member's shorthand cannot make every Herder in the
# channel answer at once.
access_mode = "authenticated"
# Used when a request names no model or agent.
default_model = "gpt-oss-120b"
channels = ["#general", "#ops"]
reconnect_initial_seconds = 2
reconnect_max_seconds = 60

[storefront]
# First live storefront pilot. Keep the public introduction small; operational
# inventory is projected from HEARTH and the attached-agent registry.
channel = "#herder-derek"
about = "Derek's BotHerder — AI systems, local inference, research, and practical tooling."
# mIRC color on bot-composed storefront lines. Model output is never colored;
# the control-character strip on completions stays regardless of this toggle.
color = true

[community]
portal_url = "http://127.0.0.1:9010"
guide_url = "https://am4.tail8e749c.ts.net/guide/"
internal_token_env = "COMMUNITY_INTERNAL_TOKEN"
# Agentic remote agents run for minutes, not seconds. Kept above the adapter's
# own OPENAI_TIMEOUT_SECONDS default (600) so the agent's specific error arrives
# before this generic ceiling fires.
agent_timeout_seconds = 660

[hearth]
# direct = current OpenAI-compatible model call; shadow = direct call plus a
# no-dispatch HEARTH routing comparison; hearth = HEARTH owns execution.
mode = "hearth"
endpoint = "https://omen.tail8e749c.ts.net:8443/mcp"
api_key_env = "HEARTH_API_KEY"
operation = "llm.chat"
request_timeout_seconds = 1250
watch_seconds = 10

[completion]
# Sent as the system message on every local model request. IRC has no markdown
# renderer, and a table costs one line per row out of max_output_lines, so a
# formatted answer is cut off long before its byte budget is spent. The bot
# also flattens markdown it receives; this keeps it from being produced at all.
# An empty string sends no system message.
system_prompt = """
You are answering in an IRC channel. Write plain text only: no markdown, no \
tables, no headings, no horizontal rules, and no bold or italic markers. Keep \
each line short and able to stand on its own. Lead with the answer, add only \
the detail that matters, and stop within a dozen short lines.
"""

[limits]
requests_per_minute = 6
max_prompt_bytes = 2048
max_output_bytes = 4096
max_output_lines = 15
irc_payload_bytes = 360
max_concurrent_requests = 2
max_pending_requests = 16

[health]
heartbeat_path = "/tmp/bot-herder-heartbeat"
heartbeat_interval_seconds = 15

[logging]
level = "INFO"
